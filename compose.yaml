name: fdi-s1
services:
  db:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_DB: fdi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FDI_POSTGRES_PASSWORD:?Run backend/scripts/init_local_env.py}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fdi']
      interval: 2s
      timeout: 3s
      retries: 30
