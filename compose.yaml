name: fdi-s1
services:
  db:
    # PostgreSQL 17.11 + pgvector 0.8.6 (Debian). The earlier alpine data in
    # storage/postgres is not reused because its libc collation differs.
    image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_DB: fdi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FDI_POSTGRES_PASSWORD:?Run backend/scripts/init_local_env.py}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - ./storage/postgres-pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fdi']
      interval: 2s
      timeout: 3s
      retries: 30
