name: Security, ingestion, and development questions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-api.lock -r backend/requirements-answer.lock
          # Linux has no hash-pinned PDF lock yet; same version as the macOS lock.
          .venv/bin/python -m pip install PyMuPDF==1.26.7
          .venv/bin/python -m pip install --no-deps -e backend
          .venv/bin/python backend/scripts/init_local_env.py
          docker compose up -d --wait db
          .venv/bin/python -m backend.scripts.migrate
          .venv/bin/python -m backend.scripts.migrate
          .venv/bin/python -m backend.scripts.prepare_test_db
          .venv/bin/python -m backend.scripts.check_clean_migrations
          # Original PDFs are not distributed, so source-value and probe checks run locally only.
          .venv/bin/python -m pytest -c backend/pytest.ini backend/tests -q -k 'not source_values' --ignore=backend/tests/ingestion/test_pdf_probe.py
      - if: always()
        run: docker compose down
